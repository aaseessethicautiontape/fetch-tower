<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#5ec8ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Fetch Tower</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: linear-gradient(#5ec8ff, #b8ecff);
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
      }
      canvas {
        image-rendering: pixelated;
        touch-action: none;
      }

      /* Nickname box: transparent, sits on top of a wooden sign drawn in the canvas. */
      .ft-sign-input {
        width: min(330px, calc(100vw - 96px));
        box-sizing: border-box;
        padding: 6px 8px;
        font-family: 'Jersey 10', sans-serif;
        font-size: 38px;
        color: #1b2a4a;
        background: transparent;
        border: none;
        outline: none;
        text-align: center;
        caret-color: #1b2a4a;
      }
      .ft-sign-input::placeholder {
        color: rgba(27, 42, 74, 0.45);
      }

      /* Door answer box: a white sticker. */
      .ft-answer {
        width: min(380px, calc(100vw - 32px));
        box-sizing: border-box;
        padding: 6px 14px;
        font-family: 'Jersey 10', sans-serif;
        font-size: 30px;
        color: #1b2a4a;
        background: #ffffff;
        border: 4px solid #1b2a4a;
        border-radius: 12px;
        box-shadow: 0 6px 0 #1b2a4a;
        outline: none;
      }
      .ft-answer:focus {
        box-shadow: 0 0 0 4px #3de0ff, 0 6px 0 #1b2a4a;
      }
      .ft-answer::placeholder {
        color: rgba(27, 42, 74, 0.4);
      }
      @media (max-width: 480px) {
        .ft-sign-input { font-size: 30px; }
        .ft-answer { font-size: 26px; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
