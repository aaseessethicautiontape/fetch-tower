<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#5ec8ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Fetch Tower</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: linear-gradient(#5ec8ff, #b8ecff);
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
      }
      canvas {
        image-rendering: pixelated;
        touch-action: none;
      }

      /* Phones held upright: ask to turn sideways (the game is a landscape 960x640 screen). */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 24px;
        background: linear-gradient(#5ec8ff, #b8ecff);
        font-family: 'Press Start 2P', monospace;
        font-size: 13px;
        line-height: 2;
        color: #ffd23f;
        text-align: center;
        text-shadow: 3px 3px 0 #1b2a4a, -2px -2px 0 #1b2a4a, 2px -2px 0 #1b2a4a, -2px 2px 0 #1b2a4a;
      }
      #rotate .phone {
        width: 54px;
        height: 92px;
        border: 6px solid #1b2a4a;
        border-radius: 10px;
        background: #ffffff;
        box-shadow: 6px 6px 0 #1b2a4a;
        animation: turn 2.2s ease-in-out infinite;
      }
      @keyframes turn {
        0%, 25% { transform: rotate(0deg); }
        55%, 100% { transform: rotate(-90deg); }
      }
      @media (orientation: portrait) {
        body.touch #rotate {
          display: flex;
        }
      }

      /* Nickname box: transparent, sits on top of a wooden sign drawn in the canvas. */
      .ft-sign-input {
        width: 330px;
        padding: 6px 8px;
        font-family: 'Jersey 10', sans-serif;
        font-size: 38px;
        color: #1b2a4a;
        background: transparent;
        border: none;
        outline: none;
        text-align: center;
        caret-color: #1b2a4a;
      }
      .ft-sign-input::placeholder {
        color: rgba(27, 42, 74, 0.45);
      }

      /* Door answer box: a white sticker. */
      .ft-answer {
        width: 380px;
        box-sizing: border-box;
        padding: 6px 14px;
        font-family: 'Jersey 10', sans-serif;
        font-size: 30px;
        color: #1b2a4a;
        background: #ffffff;
        border: 4px solid #1b2a4a;
        border-radius: 12px;
        box-shadow: 0 6px 0 #1b2a4a;
        outline: none;
      }
      .ft-answer:focus {
        box-shadow: 0 0 0 4px #3de0ff, 0 6px 0 #1b2a4a;
      }
      .ft-answer::placeholder {
        color: rgba(27, 42, 74, 0.4);
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div class="phone"></div><p style="margin: 0; max-width: 300px">Turn your phone sideways to play!</p></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
